<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Money - RTGS | HDFC NetBanking</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center;
        }
        .success-icon { color: #10b981; font-size: 50px; margin-bottom: 15px; }
        .btn-secondary { background: #e5e7eb; color: #374151; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-top: 15px; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo"><svg width="150" height="28" viewBox="0 0 200 35" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="35" height="35" fill="#ffffff" /><path d="M 0 0 L 15 0 L 15 5 L 5 5 L 5 15 L 0 15 Z" fill="#ed232a" /><path d="M 35 0 L 20 0 L 20 5 L 30 5 L 30 15 L 35 15 Z" fill="#ed232a" /><path d="M 0 35 L 15 35 L 15 30 L 5 30 L 5 20 L 0 20 Z" fill="#ed232a" /><path d="M 35 35 L 20 35 L 20 30 L 30 30 L 30 20 L 35 20 Z" fill="#ed232a" /><rect x="10" y="10" width="15" height="15" fill="#004b8f" /><rect x="35" y="0" width="165" height="35" fill="#004b8f" /><text x="50" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">HDFC BANK</text></svg></div>
        </div>
        <div class="nav-right">
            <a href="index.html">Home</a><div class="avatar">SB</div>
        </div>
    </nav>

    <div class="container">
        <div class="main-content" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto;">
            <h2 style="margin-bottom: 20px; border-bottom: 2px solid var(--theme-banner); padding-bottom: 15px;">RTGS Transfer</h2>
            
            <form id="transferForm">
                <input type="hidden" id="txnType" value="RTGS">
                
                <div class="form-group">
                    <label>From Account</label>
                    <select class="form-control" id="fromAccount" required></select>
                </div>
                
                <div class="form-group">
                    <label>Payee Name</label>
                    <input type="text" class="form-control" id="payeeName" placeholder="Enter Beneficiary Name" required>
                </div>
                
                <div class="form-group">
                    <label>Beneficiary Account Number</label>
                    <input type="text" class="form-control" id="toAccount" placeholder="Enter Account Number" required>
                </div>
                
                <div class="form-group">
                    <label>IFSC Code</label>
                    <input type="text" class="form-control" placeholder="e.g. SBIN0001234" required>
                </div>
                
                <div class="form-group">
                    <label>Amount (₹) - Minimum 2,00,000 for RTGS</label>
                    <input type="number" class="form-control" id="amount" placeholder="Enter Amount" min="200000" required>
                </div>
                
                <div class="form-group">
                    <label>Remarks (Optional)</label>
                    <input type="text" class="form-control" id="remarks" placeholder="Enter Remarks">
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;">Confirm & Transfer</button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <i class="fas fa-check-circle success-icon"></i>
            <h3>Transfer Successful</h3>
            <p style="color: #666; margin: 10px 0; font-size: 14px;">Your RTGS transaction has been processed.</p>
            <div style="background: #f9fafb; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; font-size: 14px;">
                <p><b>Ref No:</b> <span id="modalRefNo"></span></p>
                <p><b>Amount:</b> <span id="modalAmount"></span></p>
            </div>
            <button class="btn-primary" id="btnDownloadSlip" style="width: 100%;"><i class="fas fa-file-archive"></i> Download Slip (ZIP)</button>
            <button class="btn-secondary" onclick="window.location.href='index.html'" style="width: 100%;">Return to Home</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/slip.js"></script>
    <script src="js/transaction.js"></script>
</body>
</html>
